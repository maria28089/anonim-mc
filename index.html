<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аноним МС</title>
<style>
:root{color-scheme:light;--ink:#18211e;--mut:#5b6663;--btn1:#8fa497;--btn2:#738a7f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:-apple-system,"Inter","Segoe UI",Roboto,sans-serif;color:var(--ink);background:#b9c6f5;transition:background .3s;-webkit-tap-highlight-color:transparent}
body[data-bg=a]{background:radial-gradient(at 20% 10%,#dfe9ff,transparent 50%),radial-gradient(at 90% 40%,#a9b8f2,transparent 55%),linear-gradient(160deg,#c3d0fa,#b4c8f6 50%,#c9d9fb)}
body[data-bg=b]{background:radial-gradient(at 10% 70%,#8fe3f7,transparent 40%),radial-gradient(at 90% 80%,#a6c6f5,transparent 45%),linear-gradient(100deg,#d2d8e6,#e8edf6 45%,#c6d4ee 80%,#d6dcec)}
#app{max-width:520px;margin:0 auto;padding:14px 20px 140px}
h1{margin:6px 0 0;text-align:center;font-size:34px;font-weight:900;letter-spacing:-.5px}
.sub{text-align:center;color:var(--mut);font-weight:700;font-size:20px;margin:2px 0 18px}
.card{background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.2));border:2px solid rgba(255,255,255,.85);border-radius:40px;padding:22px;margin-bottom:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(90,110,170,.12)}
.card h2{margin:0 0 14px;font-size:26px;font-weight:800}
h3{font-size:34px;font-weight:900;margin:22px 6px 12px}
input,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:rgba(255,255,255,.65);border:2px solid rgba(255,255,255,.9);border-radius:28px;padding:14px 20px;outline:none}
textarea{resize:none;min-height:140px;line-height:1.4}
::placeholder{color:#7d8490}
.btn{font:inherit;font-size:17px;border:2px solid rgba(255,255,255,.5);color:#fff;background:linear-gradient(var(--btn1),var(--btn2));border-radius:40px;padding:17px;width:100%;cursor:pointer;margin-top:14px;box-shadow:0 4px 12px rgba(80,100,90,.25)}
.btn:active{transform:scale(.98)}
.btn.w{background:rgba(255,255,255,.8);color:var(--ink);box-shadow:none}
.row{display:flex;gap:12px;align-items:center}
.row .btn{margin-top:0}
.big{font-size:70px;font-weight:900;line-height:1}
.lbl{font-size:23px;font-weight:800;color:var(--mut)}
.stat{flex:1;margin:0}.stat .big{color:var(--ink)}.stat.g .big{color:#738a7f}
.avatar{width:96px;height:96px;flex:none;border-radius:50%;background:rgba(255,255,255,.7);border:3px solid #fff;display:grid;place-items:center;position:relative;cursor:pointer}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar .cam{position:absolute;right:-6px;bottom:-6px;width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:12px 20px;border-radius:30px;font-weight:800;font-size:20px;background:rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.8);color:var(--mut)}
.chip.done{background:linear-gradient(var(--btn1),var(--btn2));color:#fff}
.tip{background:rgba(255,255,255,.7);border-radius:30px;padding:18px 22px;font-size:21px;font-weight:600;margin-bottom:12px;line-height:1.3}
.ruled{background:repeating-linear-gradient(transparent 0 47px,#c3c6dc 47px 48px),rgba(255,255,255,.65);line-height:48px!important;padding:0 20px!important;min-height:240px!important;background-attachment:local}
.entry{background:rgba(255,255,255,.7);border-radius:28px;padding:16px 20px;margin-bottom:12px;position:relative}
.entry small{color:var(--mut);font-weight:700;display:block;margin-bottom:6px}
.entry p{margin:0;white-space:pre-wrap;word-break:break-word;font-size:17px}
.del{position:absolute;right:14px;top:12px;border:0;background:none;font-size:22px;color:#8a929c;cursor:pointer}
.empty{text-align:center;color:var(--mut);font-weight:700;font-size:22px;margin:22px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.emo{border:3px solid rgba(255,255,255,.85);border-radius:28px;padding:14px 0 10px;text-align:center;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.emo span{display:block;font-size:38px;margin-bottom:6px}
.emo.on{border-color:#4d6a5c;box-shadow:0 0 0 3px rgba(77,106,92,.35)}
.breath{width:180px;height:180px;margin:10px auto 18px;display:grid;place-items:center;border-radius:50%;border:3px solid #fff;background:radial-gradient(#fff,#cfe0fb);font:inherit;font-size:24px;font-weight:800;color:var(--ink);cursor:pointer;transition:transform 4s ease-in-out}
.breath.in{transform:scale(1.25)}
.cap{text-align:center;color:var(--mut);font-weight:700;font-size:20px}
.circle{width:300px;max-width:100%;aspect-ratio:1;margin:6px auto 14px;border-radius:50%;background:rgba(255,255,255,.75);border:3px solid #fff;display:grid;place-content:center;text-align:center}
.contact{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.7);border-radius:28px;padding:12px 18px;margin-bottom:10px}
.contact div{flex:1;min-width:0;font-weight:700;font-size:18px}.contact small{display:block;color:var(--mut)}
.contact a{background:var(--btn2);color:#fff;text-decoration:none;border-radius:20px;padding:9px 14px;font-weight:700}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(480px,calc(100% - 28px));display:flex;padding:8px;border-radius:44px;background:linear-gradient(145deg,rgba(235,240,255,.85),rgba(215,228,252,.8));border:2px solid rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(80,100,160,.2)}
nav button{flex:1;border:0;background:none;font:inherit;font-size:12px;color:#55625e;padding:10px 0 8px;border-radius:34px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
nav button.on{background:rgba(255,255,255,.85)}
nav svg{width:30px;height:30px;fill:none;stroke:#55625e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .on svg{fill:#c8d2cd}
</style></head><body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={name:'',photo:'',about:'',ach:[],diary:[],emo:[],start:'',contacts:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem('anonms')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('anonms',JSON.stringify(S))}catch(e){}};
const fmt=d=>new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
const fmtT=d=>new Date(d).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
const todayISO=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')};
function days(){if(!S.start)return 0;const[y,m,d]=S.start.split('-').map(Number);const n=new Date();return Math.max(0,Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(y,m-1,d))/864e5))}
const MS=[[1,'1 день'],[7,'7 дн.'],[30,'30 дн.'],[60,'60 дн.'],[90,'90 дн.'],[180,'180 дн.'],[365,'1 год']];
const EM=[['sad','😢','Грусть','#dcdcee'],['joy','😄','Радость','#d3e8df'],['anger','😠','Злость','#efd5df'],['anx','😰','Тревога','#f1e1d3'],['grief','🌧️','Печаль','#e2d8ee'],['fear','😨','Страх','#d6d9e6'],['dis','🤢','Отвращение','#dfe8cf'],['sur','😲','Удивление','#f3eac8']];
const ICON={
p:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6z"/>',
d:'<path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14"/>',
e:'<circle cx="12" cy="12" r="9"/><path d="M8 14c1 2.5 7 2.5 8 0z"/><path d="M9 9.5v.5M15 9.5v.5"/>',
c:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/>',
s:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>'};
const PAGES=[['p','Профиль'],['d','Дневник'],['e','Эмоции'],['c','Чистота'],['s','Поддержка']];
let page='p',selEmo=null,breathT=null;
function go(p){page=p;stopBreath();render();window.scrollTo(0,0)}
function nav(){$('#nav').innerHTML=PAGES.map(([k,t])=>`<button class="${k==page?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${t}</button>`).join('')}
const head=(t,s)=>`<h1>${t}</h1><div class="sub">${s}</div>`;
const list=(arr,key,empty)=>arr.length?arr.map((x,i)=>({x,i})).reverse().map(({x,i})=>`<div class="entry"><button class="del" onclick="delItem('${key}',${i})">×</button><small>${fmtT(x.t)}${x.tag?' · '+x.tag:''}</small><p>${esc(x.text)}</p></div>`).join(''):`<div class="empty">${empty}</div>`;
function delItem(k,i){S[k].splice(i,1);save();render()}

const V={
p(){const d=days(),done=MS.filter(m=>d>=m[0]).length+S.ach.length;
return head('Профиль','Моё пространство')+`
<div class="card"><div class="row"><label class="avatar">${S.photo?`<img src="${S.photo}">`:'<svg width="46" height="46" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6z"/></svg>'}<span class="cam">📷</span><input type="file" accept="image/*" hidden onchange="photo(this)"></label>
<div style="flex:1"><input id="nm" placeholder="Псевдоним" value="${esc(S.name)}" oninput="S.name=this.value;save()"><div class="lbl" style="font-size:19px;margin-top:10px">Можно оставить пустым</div></div></div></div>
<div class="row" style="margin-bottom:16px"><div class="card stat"><div class="big">${d}</div><div class="lbl">дней чистоты</div></div><div class="card stat g"><div class="big">${done}</div><div class="lbl">достижений</div></div></div>
<div class="card"><h2>О себе</h2><textarea placeholder="Дополнительная информация: что для меня важно, что помогает…" oninput="S.about=this.value;save()">${esc(S.about)}</textarea></div>
<div class="card"><h2>Вехи</h2><div class="chips">${MS.map(m=>`<span class="chip ${d>=m[0]?'done':''}">${m[1]}</span>`).join('')}</div></div>
<div class="card"><h2>Мои достижения</h2><input id="ach" placeholder="Например: впервые отказался(лась) от встречи…"><button class="btn" onclick="addAch()">Добавить</button><div style="margin-top:14px">${list(S.ach,'ach','Пока пусто')}</div></div>`},
d(){return head('Дневник','Личные записи')+`
<div class="card"><h2 style="font-size:24px">${fmt(Date.now())}</h2><textarea id="dt" class="ruled" placeholder="Что происходило сегодня…"></textarea><button class="btn" onclick="addDiary()">Сохранить запись</button></div>
<h3>Последние записи</h3>${list(S.diary,'diary','Пока нет записей')}`},
e(){const cur=EM.find(e=>e[0]==selEmo);const h=S.emo.map((x,i)=>({...x,i})).filter(x=>x.k==selEmo);
return head('Эмоции','Моё состояние')+`
<div class="card"><h2>Как я себя чувствую?</h2><div class="grid">${EM.map(e=>`<button class="emo ${e[0]==selEmo?'on':''}" style="background:${e[3]}" onclick="selEmo='${e[0]}';render()"><span>${e[1]}</span>${e[2]}</button>`).join('')}</div>
<h2>Что могло вызвать это чувство?</h2><textarea id="et" placeholder="Ситуация, мысль, разговор, воспоминание…"></textarea><button class="btn" onclick="addEmo()">Сохранить</button></div>
<h3>История</h3>${cur?(h.length?h.reverse().map(x=>`<div class="entry"><button class="del" onclick="delItem('emo',${x.i})">×</button><small>${fmtT(x.t)} · ${cur[1]} ${cur[2]}</small><p>${esc(x.text)||'—'}</p></div>`).join(''):`<div class="empty">Записей про «${cur[2].toLowerCase()}» пока нет</div>`):'<div class="empty">Выбери эмоцию выше</div>'}`},
c(){const d=days();return head('Чистота','Счётчик дней')+`
<div class="card"><div class="circle"><div class="big" style="font-size:96px">${d}</div><div class="lbl">${plural(d)} чистоты</div></div>
<div class="cap">${S.start?'С '+fmt(S.start+'T12:00'):'Укажи дату начала отсчёта'}</div></div>
<div class="card"><h2>Дата начала</h2><input type="date" id="sd" max="${todayISO()}" value="${S.start}"><div class="row" style="margin-top:14px"><button class="btn" style="flex:2" onclick="setStart()">Начать отсчёт</button><button class="btn w" style="flex:1" onclick="resetStart()">Сбросить</button></div></div>`},
s(){return head('Поддержка','Ты не один')+`
<div class="card" style="text-align:center"><h2>Подышим вместе</h2><button class="breath" id="br" onclick="breath()">Начать</button><div class="cap">Вдох 4 сек · выдох 4 сек</div></div>
<div class="card"><h2>Если накрывает тяга</h2><div class="tip">Подожди 15 минут — тяга проходит волнами.</div><div class="tip">Выпей воды, выйди на воздух, смени обстановку.</div><div class="tip">Позвони человеку из списка ниже, пока не стало хуже.</div></div>
<div class="card"><h2>Мои контакты</h2>${S.contacts.map((c,i)=>`<div class="contact"><div>${esc(c.n)}<small>${esc(c.p)}</small></div><a href="tel:${esc(c.p.replace(/[^+\d]/g,''))}">Позвонить</a><button class="del" style="position:static" onclick="delItem('contacts',${i})">×</button></div>`).join('')||'<div class="empty" style="font-size:18px;margin-top:0">Добавь тех, кому можно позвонить</div>'}
<input id="cn" placeholder="Имя" style="margin-bottom:10px"><input id="cp" type="tel" placeholder="Телефон"><button class="btn" onclick="addContact()">Добавить контакт</button></div>`}};
function plural(n){const a=n%100,b=n%10;return a>10&&a<15?'дней':b==1?'день':b>1&&b<5?'дня':'дней'}
function render(){document.body.dataset.bg=['p','e','s'].includes(page)?'a':'b';$('#app').innerHTML=V[page]();nav()}
function photo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,240,240);S.photo=c.toDataURL('image/jpeg',.8);save();render()};im.src=r.result};r.readAsDataURL(f)}
function addAch(){const v=$('#ach').value.trim();if(!v)return;S.ach.push({t:Date.now(),text:v});save();render()}
function addDiary(){const v=$('#dt').value.trim();if(!v)return;S.diary.push({t:Date.now(),text:v});save();render()}
function addEmo(){if(!selEmo){alert('Сначала выбери эмоцию');return}S.emo.push({t:Date.now(),k:selEmo,text:$('#et').value.trim()});save();render()}
function setStart(){const v=$('#sd').value;if(!v){alert('Выбери дату в календаре');return}S.start=v;save();render()}
function resetStart(){if(confirm('Сбросить счётчик?')){S.start='';save();render()}}
function addContact(){const n=$('#cn').value.trim(),p=$('#cp').value.trim();if(!n||!p)return;S.contacts.push({n,p});save();render()}
function stopBreath(){clearInterval(breathT);breathT=null}
function breath(){const b=$('#br');if(breathT){stopBreath();b.className='breath';b.textContent='Начать';return}
let inh=true;const tick=()=>{b.classList.toggle('in',inh);b.textContent=inh?'Вдох':'Выдох';inh=!inh};setTimeout(()=>{},0);tick();breathT=setInterval(tick,4000)}
render();
</script></body></html>
